defaultvalue: com.google.gson.JsonNull.INSTANCE
scopes:
  local:
    init: ${var.getType().getJavaType(generator.getWorkspace())} ${var.getName()} = ${var.getType().getDefaultValue(generator.getWorkspace())};
    get: ${name}
    set: ${name} = ${value};
  global_session:
    init: public static com.google.gson.JsonElement ${var.getName()} = com.google.gson.JsonNull.INSTANCE;
    get: ${JavaModName}Variables.${name}
    set: ${JavaModName}Variables.${name} = ${value};
